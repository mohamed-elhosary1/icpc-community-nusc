<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUSC Admin | Sign In</title>
    <meta name="theme-color" content="#001a41" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#002e69',
                        'navy-light': '#004494',
                        'navy-dark': '#001a41',
                        'gold': '#fea520',
                        'gold-light': '#ffddb9',
                        'gold-dark': '#865300',
                        'red-accent': '#920907',
                        'cream': '#fbf9f5',
                        'cream-dark': '#f5f3ef',
                        'ink': '#1b1c1a',
                    },
                    fontFamily: {
                        'minecraft': ['MinecraftArabic', '"Press Start 2P"', 'Silkscreen', 'monospace'],
                        'display': ['Outfit', 'sans-serif'],
                        'body': ['Plus Jakarta Sans', 'sans-serif'],
                        'label': ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'MinecraftArabic';
            src: url('/fonts/minecraft-ten-arabic.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        .pixel-art { image-rendering: pixelated; }
        .pixel-border { border: 2px solid #1b1c1a; }
        .pixel-border-gold { border: 2px solid #fea520; }
        .pixel-shadow-gold { box-shadow: 4px 4px 0px 0px #fea520; }
        .pixel-shadow-ink { box-shadow: 4px 4px 0px 0px #1b1c1a; }

        .pixel-btn-gold {
            border: 2px solid #1b1c1a;
            box-shadow: 4px 4px 0px 0px #002e69;
            transition: all 0.15s ease;
        }
        .pixel-btn-gold:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #002e69;
        }
        .pixel-btn-gold:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #002e69;
        }

        /* =============================================
           INPUT BOX VISIBILITY & HIGH-CONTRAST FIX
           ============================================= */
        input[type="text"],
        input[type="password"],
        .pixel-input {
            width: 100%;
            background-color: #00122e !important;
            color: #ffffff !important;
            border: 2px solid #004494 !important;
            caret-color: #fea520 !important;
            -webkit-text-fill-color: #ffffff !important;
            padding: 12px 14px;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder,
        .pixel-input::placeholder {
            color: rgba(251, 249, 245, 0.45) !important;
            -webkit-text-fill-color: rgba(251, 249, 245, 0.45) !important;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        .pixel-input:focus {
            background-color: #00183b !important;
            color: #ffffff !important;
            border-color: #fea520 !important;
            box-shadow: 3px 3px 0px 0px #fea520 !important;
            outline: none !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #00122e inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .bg-pixel-grid {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23004494' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-navy-dark bg-pixel-grid min-h-screen flex items-center justify-center p-4 selection:bg-gold selection:text-navy">

    <!-- Top Left Back to Public Site Link -->
    <a href="/" class="fixed top-6 left-6 text-cream-dark/60 hover:text-gold transition-colors flex items-center gap-2 font-label text-xs uppercase font-bold tracking-wider">
        <span class="material-symbols-outlined text-sm">arrow_back</span> Return to Website
    </a>

    <div class="max-w-md w-full relative z-10">
        <!-- Floating Trophy Badge -->
        <div class="flex justify-center -mb-8 relative z-20">
            <div class="w-16 h-16 bg-navy pixel-border-gold rounded-full flex items-center justify-center pixel-shadow-gold">
                <img src="/assets/Objects/Bedroom/Trophy.png" class="pixel-art w-8 h-8" alt="NUSC Logo" />
            </div>
        </div>

        <div class="bg-navy p-8 md:p-10 pixel-border border-gold/40 relative pt-12">
            <!-- Header -->
            <div class="text-center mb-8">
                <span class="font-minecraft text-[10px] text-navy bg-gold font-bold px-2.5 py-1 inline-block uppercase tracking-widest mb-2">CONTROL CENTER</span>
                <h1 class="font-display font-black text-3xl text-white tracking-tight">NUSC ADMIN</h1>
                <p class="font-body text-xs text-cream-dark/70 mt-1">Community Management Dashboard</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden mb-6 bg-red-accent/20 border-2 border-red-accent text-red-light p-3 text-xs font-body flex items-start gap-2">
                <span class="material-symbols-outlined text-base flex-shrink-0 text-red-accent">error</span>
                <span id="error-msg">Invalid administrator credentials.</span>
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block font-label text-xs text-gold uppercase tracking-wider font-bold mb-1">Admin Username</label>
                    <input type="text" id="username" class="pixel-input" placeholder="Enter administrator username" required autofocus autocomplete="username" />
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block font-label text-xs text-gold uppercase tracking-wider font-bold">Password</label>
                    </div>
                    <input type="password" id="password" class="pixel-input" placeholder="••••••••" required autocomplete="current-password" />
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3 bg-gold text-ink font-display font-black text-sm tracking-wider uppercase pixel-btn-gold hover:bg-white transition-colors flex items-center justify-center gap-2 mt-2">
                    <span class="material-symbols-outlined text-base">lock_open</span>
                    SIGN IN
                </button>
            </form>
        </div>

        <p class="text-center font-minecraft text-[10px] text-white/30 mt-6 tracking-widest uppercase">
            ICPC NUSC &bull; RESTRICTED INTERNAL ACCESS
        </p>
    </div>

    <!-- Central Data Store & Auth Logic -->
    <script src="/js/data-store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already authenticated, redirect directly to admin
            if (window.NUSC_AUTH && window.NUSC_AUTH.isAuthenticated()) {
                window.location.href = '/admin';
                return;
            }

            const form = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const errorBanner = document.getElementById('error-banner');
            const errorMsg = document.getElementById('error-msg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBanner.classList.add('hidden');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> VERIFYING...';

                try {
                    const res = await window.NUSC_AUTH.login(usernameInput.value, passwordInput.value);
                    if (res.success) {
                        window.location.href = '/admin';
                    } else {
                        errorMsg.textContent = res.message || 'Invalid administrator credentials.';
                        errorBanner.classList.remove('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span class="material-symbols-outlined text-base">lock_open</span> SIGN IN';
                    }
                } catch (err) {
                    errorMsg.textContent = 'Server connection error. Please try again.';
                    errorBanner.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="material-symbols-outlined text-base">lock_open</span> SIGN IN';
                }
            });
        });
    </script>
</body>
</html>
